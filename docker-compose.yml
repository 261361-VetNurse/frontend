version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vetnurse-frontend:latest
    container_name: vetnurse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
      # ── Backend API ──────────────────────────────────────────────
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # ── LINE Login ───────────────────────────────────────────────
      - NEXT_PUBLIC_LINE_CLIENT_ID=${NEXT_PUBLIC_LINE_CLIENT_ID}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
      - NEXT_PUBLIC_LINE_REDIRECT_PATH=${NEXT_PUBLIC_LINE_REDIRECT_PATH}
      # ── Cloudflare R2 (server-only) ──────────────────────────────
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - NEXT_PUBLIC_R2_PUBLIC_URL=${NEXT_PUBLIC_R2_PUBLIC_URL}
    deploy:
      resources:
        limits:
          memory: 768M # container hard cap (Node heap is 512M inside)
        reservations:
          memory: 256M
